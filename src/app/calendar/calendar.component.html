<div>
  <table>
    <thead>
      <tr>
        <td>{{ currentDate | date : "MMMM yyyy" }}</td>
      </tr>
    </thead>
    <tbody>
      <day-container>
        @for (day of dayNames; track day) {
        <app-day>{{ day }}</app-day>
        }
      </day-container>
      <day-container>
        @for (item of spacerDays; track item) {
        <app-day></app-day>
        } @for(cell of cellsArray; track cell) {
        <app-day class="calendar-item">{{ cell }}</app-day>
        }
      </day-container>
    </tbody>
  </table>
</div>
