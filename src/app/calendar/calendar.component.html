<div>
    <table>
        <thead>
            <tr>
                <td>{{ currentDate | date: 'MMMM' }}</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <app-week-day/>
            </tr>
            <tr>
                <day-container>
                    @for(cell of cellsArray; track cell) {
                        <td>{{ cell }}</td>
                    } 
                </day-container>
            </tr>
        </tbody>
    </table>
</div>
